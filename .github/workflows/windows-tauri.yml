
name: Build Windows MSI

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Prepare backend resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            "apps/desktop/src-tauri/resources" | Out-Null

      - name: Build Backend
        working-directory: backend
        run: go build -o ../apps/desktop/src-tauri/resources/financeapp-backend.exe ./cmd/financeapp

      - name: Install Frontend Dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Tauri MSI
        working-directory: apps/desktop
        run: cargo tauri build --target x86_64-pc-windows-msvc --bundles msi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Inspect Tauri artifacts
        shell: pwsh
        run: |
          Get-ChildItem "apps/desktop/src-tauri/target/release/bundle" -Recurse -File |
            Select-Object FullName

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinanceApp-MSI
          path: apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/msi/*.sig
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

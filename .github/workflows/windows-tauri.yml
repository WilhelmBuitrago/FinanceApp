name: Build Windows MSI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Backend
        run: |
          cd backend
          go build -o ../apps/desktop/src-tauri/resources/financeapp-backend.exe ./cmd/financeapp
      - name: Install Frontend Deps
        run: |
          cd apps/desktop
          npm ci
      - name: Build Frontend
        run: |
          cd apps/desktop
          npm run build
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "2"
      - name: Build Tauri MSI
        run: |
          cd apps/desktop
          cargo tauri builder build --target x86_64-pc-windows-msvc
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinanceApp-MSI
          path: apps/desktop/src-tauri/target/release/bundle/msi/*.msi
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

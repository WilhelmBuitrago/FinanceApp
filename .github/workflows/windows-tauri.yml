name: Build Windows MSI

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Go: usa la versión declarada en backend/go.mod.
      # La caché depende del go.sum que realmente existe.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download Go dependencies
        working-directory: backend
        run: go mod download

      - name: Verify Go dependencies
        working-directory: backend
        run: go mod verify

      # Node se necesita para construir el frontend.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # Rust se configura para compilar el MSI de Windows x64.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Prepare backend resources
        shell: pwsh
        run: |
          $resources = "apps/desktop/src-tauri/resources"
          $processor = Join-Path $resources "processor"
          $pythonDir = Join-Path $resources "python-runtime"
          $wheelsDir = Join-Path $resources "python-wheels"

          New-Item -ItemType Directory -Force $resources | Out-Null
          New-Item -ItemType Directory -Force $processor | Out-Null
          New-Item -ItemType Directory -Force $pythonDir | Out-Null
          New-Item -ItemType Directory -Force $wheelsDir | Out-Null

          Copy-Item `
            -Path "apps/processor/*" `
            -Destination $processor `
            -Recurse `
            -Force

          if (-not (Test-Path (Join-Path $processor "requirements-lock.txt"))) {
            throw "No se encontró apps/processor/requirements-lock.txt"
          }

          # Download bundled Python runtime for offline first run
          $pythonUrl = "https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.zip"
          $pythonZip = Join-Path $pythonDir "python-3.12.10-amd64.zip"
          if (-not (Test-Path $pythonZip)) {
            Invoke-WebRequest -Uri $pythonUrl -OutFile $pythonZip -UseBasicParsing
          }

      - name: Setup Python for wheels
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Python wheels offline
        shell: pwsh
        run: |
          $resources = "apps/desktop/src-tauri/resources"
          $wheelsDir = Join-Path $resources "python-wheels"
          $reqFile = "apps/processor/requirements-lock.txt"
          pip download -r $reqFile --dest $wheelsDir --platform win_amd64 --only-binary=:all: --no-deps
          pip download -r $reqFile --dest $wheelsDir --platform win_amd64 --only-binary=:all:
          # Also download transitive dependencies
          Get-ChildItem $wheelsDir | Write-Host

      # Todos los comandos Go se ejecutan desde backend.
      - name: Build Backend
        working-directory: backend
        run: go build -o ../apps/desktop/src-tauri/resources/financeapp-backend.exe ./cmd/financeapp

      - name: Verify Backend executable
        shell: pwsh
        run: |
          $backend = "apps/desktop/src-tauri/resources/financeapp-backend.exe"

          if (-not (Test-Path $backend)) {
            throw "No se generó el ejecutable del backend: $backend"
          }

          Get-Item $backend | Select-Object FullName, Length

      - name: Install Frontend Dependencies
        working-directory: apps/desktop
        run: npm ci

      # Caché del CLI de Tauri.
      - name: Cache Tauri CLI
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin
          key: tauri-cli-2.12.3-${{ runner.os }}-${{ runner.arch }}

      - name: Install Tauri CLI
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-tauri -ErrorAction SilentlyContinue)) {
            cargo install tauri-cli --version 2.12.3 --locked
            if ($LASTEXITCODE -ne 0) {
              throw "No se pudo instalar Tauri CLI"
            }
          }

          cargo tauri --version
          if ($LASTEXITCODE -ne 0) {
            throw "Tauri CLI no está disponible"
          }


      - name: Diagnose WiX inputs
        shell: pwsh
        run: |
          Write-Host "Working directory: $(Get-Location)"

          $paths = @(
            "apps/desktop/src-tauri/main.wxs",
            "apps/desktop/src-tauri/tauri.conf.json",
            "apps/desktop/src-tauri/custom.wxs"
          )

          foreach ($path in $paths) {
            Write-Host "$path : $(Test-Path $path)"
          }

          Get-Content "apps/desktop/src-tauri/tauri.conf.json" -Raw
          
      # Genera el MSI y los artefactos de firma del actualizador.
      - name: Build Tauri MSI
        working-directory: apps/desktop
        run: cargo tauri build --verbose --target x86_64-pc-windows-msvc --bundles msi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Inspect Tauri artifacts
        shell: pwsh
        run: |
          $bundle = "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle"

          if (-not (Test-Path $bundle)) {
            throw "No se encontró el directorio de artefactos de Tauri"
          }

          Get-ChildItem $bundle -Recurse -File |
            Select-Object FullName, Length

          $msi = Get-ChildItem "$bundle/msi/*.msi" -File
          if (-not $msi) {
            throw "No se generó ningún archivo MSI"
          }



      - name: Diagnose custom actions in MSI
        shell: pwsh
        run: |
          $msiDir = "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi"
          $msis = @(Get-ChildItem $msiDir -Filter "*.msi" -File)

          if ($msis.Count -eq 0) {
            throw "No se encontró ningún MSI en $msiDir"
          }

          Write-Host "=== MSI encontrados ==="
          $msis | Select-Object Name, Length, LastWriteTime, FullName |
            Format-Table -AutoSize

          $installer = New-Object -ComObject WindowsInstaller.Installer

          foreach ($msi in $msis) {
            Write-Host "=== Inspeccionando: $($msi.Name) ==="
            $database = $installer.OpenDatabase($msi.FullName, 0)

            $view = $database.OpenView(
              'SELECT `Action`, `Type`, `Source`, `Target` FROM `CustomAction`'
            )
            $view.Execute()

            while ($record = $view.Fetch()) {
              $name = $record.StringData(1)
              if ($name -match "Python|Prepare|FinanceAppProgramData") {
                Write-Host (
                  "Action={0}; Type={1}; Source={2}; Target={3}" -f
                  $name,
                  $record.StringData(2),
                  $record.StringData(3),
                  $record.StringData(4)
                )
              }
            }

            $view.Close()
          }

      - name: Verify custom actions in MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem `
            "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi" `
            -File |
            Select-Object -First 1

          if (-not $msi) {
            throw "No se encontró el MSI para verificar."
          }

          Write-Host "MSI inspeccionado: $($msi.FullName)"

          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($msi.FullName, 0)

          function Get-MsiRows {
            param(
              [string]$Query,
              [int[]]$Columns
            )

            $view = $database.OpenView($Query)

            try {
              $view.Execute()

              while ($record = $view.Fetch()) {
                $row = @{}

                foreach ($column in $Columns) {
                  $row[$column] = $record.StringData($column)
                }

                [pscustomobject]$row
              }
            }
            finally {
              $view.Close()
            }
          }

          # Leer las acciones del MSI.
          $customActions = @(
            Get-MsiRows `
              -Query 'SELECT `Action`, `Type`, `Source`, `Target` FROM `CustomAction`' `
              -Columns @(1, 2, 3, 4)
          )

          Write-Host "Cantidad de acciones leídas: $($customActions.Count)"
          $customActions | Format-List *

          # Consulta directa para contrastar con Get-MsiRows.
          Write-Host "=== Consulta directa de RunPreparePython ==="

          $view = $database.OpenView(
            "SELECT ``Action``, ``Type``, ``Source``, ``Target`` FROM ``CustomAction`` WHERE ``Action`` = 'RunPreparePython'"
          )

          try {
            $view.Execute()
            $record = $view.Fetch()

            if ($null -eq $record) {
              Write-Host "La consulta directa NO encontró RunPreparePython."
            }
            else {
              Write-Host "Action: $($record.StringData(1))"
              Write-Host "Type: $($record.StringData(2))"
              Write-Host "Source: $($record.StringData(3))"
              Write-Host "Target: $($record.StringData(4))"
            }
          }
          finally {
            $view.Close()
          }

          # Leer la secuencia de instalación.
          $sequence = @(
            Get-MsiRows `
              -Query 'SELECT `Action`, `Condition`, `Sequence` FROM `InstallExecuteSequence`' `
              -Columns @(1, 2, 3)
          )

          # La acción antigua no debe estar definida ni programada.
          if (@($customActions | Where-Object {
            $_.Action -eq "SetRunPreparePython"
          }).Count -gt 0) {
            throw "SetRunPreparePython sigue definida en el MSI."
          }

          if (@($sequence | Where-Object {
            $_.Action -eq "SetRunPreparePython"
          }).Count -gt 0) {
            throw "SetRunPreparePython sigue programada en InstallExecuteSequence."
          }

          Write-Host "OK: SetRunPreparePython no está activa."

          # Validar RunPreparePython.
          $pythonAction = @(
            $customActions | Where-Object {
              [string]($_.PSObject.Properties["Action"].Value) -ceq "RunPreparePython"
            }
          )

          Write-Host "Coincidencias de RunPreparePython: $($pythonAction.Count)"

          if ($pythonAction.Count -eq 0) {
            Write-Host "=== Nombres de acciones leídos ==="

            foreach ($item in $customActions) {
              Write-Host "[$($item.PSObject.Properties['Action'].Value)]"
            }

            throw "La consulta general no encontró RunPreparePython, aunque la consulta directa sí la encontró."
          }

          if ($pythonAction.Count -ne 1) {
            throw "Se esperaba una definición de RunPreparePython; encontradas: $($pythonAction.Count)."
          }

          $action = $pythonAction[0]

          # Tipo observado en el MSI generado: 3106.
          if ([int]$action.Type -ne 3106) {
            throw "Tipo inesperado para RunPreparePython: $($action.Type). Se esperaba 3106."
          }

          if ($action.Source -ne "INSTALLDIR") {
            throw "Directorio de trabajo inesperado para RunPreparePython: $($action.Source)."
          }

          if ($action.Target -notmatch 'WindowsPowerShell\\v1\.0\\powershell\.exe') {
            throw "RunPreparePython no apunta a Windows PowerShell de 64 bits."
          }

          if ($action.Target -notmatch 'resources\\prepare-python\.ps1') {
            throw "RunPreparePython no apunta a resources\prepare-python.ps1."
          }

          # Comprobar el orden real, sin asumir el número 4001.
          $installFiles = @(
            $sequence | Where-Object { $_.Action -eq "InstallFiles" }
          )

          $pythonSequence = @(
            $sequence | Where-Object { $_.Action -eq "RunPreparePython" }
          )

          if ($installFiles.Count -ne 1) {
            throw "Se esperaba una entrada de InstallFiles en InstallExecuteSequence."
          }

          if ($pythonSequence.Count -ne 1) {
            throw "Se esperaba una entrada de RunPreparePython en InstallExecuteSequence."
          }

          if ([int]$pythonSequence[0].Sequence -le [int]$installFiles[0].Sequence) {
            throw "RunPreparePython no está programada después de InstallFiles."
          }

          if ($pythonSequence[0].Condition -notmatch 'NOT Installed' -or
              $pythonSequence[0].Condition -notmatch 'NOT REMOVE') {
            throw "Condición inesperada para RunPreparePython: $($pythonSequence[0].Condition)"
          }

          Write-Host "OK: RunPreparePython está definida con tipo 3106."
          Write-Host "OK: apunta al script prepare-python.ps1."
          Write-Host "OK: se ejecuta después de InstallFiles."
          Write-Host "OK: la condición corresponde a una instalación nueva."

          # Verificar la acción de limpieza.
          foreach ($actionName in @("RemoveFinanceAppProgramData")) {
            if ($actionName -notin $customActions.Action) {
              throw "El MSI no contiene la acción: $actionName"
            }

            if ($actionName -notin $sequence.Action) {
              throw "La acción $actionName no está programada en InstallExecuteSequence."
            }

            Write-Host "OK: $actionName está definida y programada."
          }

          Write-Host "Verificación de acciones MSI completada."



      - name: Upload Artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: FinanceApp-MSI
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.sig
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.sig
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

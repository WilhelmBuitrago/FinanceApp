version: "2"
sql:
  - engine: "sqlite"
    schema:
      # Glob on purpose: a new migration applies without touching this file
      # (the applied migrations are also read from the directory at runtime).
      - "internal/db/migrations/*.sql"
    queries: "db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
